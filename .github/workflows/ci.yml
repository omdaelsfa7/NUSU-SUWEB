name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://su_admin:su_password123@localhost:5432/suweb_db?schema=public"
      JWT_SECRET: "nusu-super-secret-jwt-key-2026"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: su_admin
          POSTGRES_PASSWORD: su_password123
          POSTGRES_DB: suweb_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        continue-on-error: true

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend not yet scaffolded. Skipping gracefully until Phase 3."
          fi

      - name: Setup Node.js 20
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run build
